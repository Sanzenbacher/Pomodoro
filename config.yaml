# Pomodoro — Voreinstellungen.
# Presets und Projekte liegen in der Datenbank und sind in der Oberflaeche
# editierbar; hier stehen nur Werte, die kein UI brauchen.

pomodoro:
  daily_goal_pomodoros: 8
  day_start_hour: 4          # Nachtsessions zaehlen auf den Vortag

  notify:
    sound: true
    toast: true
    raise_window: true
    sound_file: static/audio/bell.wav

  # Ueberzeit: nach dem Ablauf zaehlt die Uhr weiter (KONZEPT.md, Abschnitt 6).
  # Nur Vorgaben -- geaendert wird unter Einstellungen.
  overtime:
    reminder_min: 5          # leiser Toast alle N Minuten, 0 = aus
    max_min: 60              # danach steht die Uhr und es kommt die Nachfrage

  # Farbwelt aus dem Projektbild (siehe KONZEPT-PROJEKTFARBEN.md).
  # false -> alle Projekte im Standardthema.
  project_colors: true
  project_image_veil: true   # Bild weichgezeichnet hinter dem Timer

# Mehrere Profile (KONZEPT-PROFILE.md). Nur fuer den allerersten Start:
# So heisst das Profil, in das die bisherigen Daten umziehen. Danach
# wird unter Einstellungen umbenannt, nicht hier.
profiles:
  first_name: Sascha

server:
  host: 127.0.0.1
  port: 5333
  # local  = eine Installation ohne Anmeldung (wie bisher)
  # hosted = Konten mit E-Mail und Passwort, alles verschluesselt
  #          (KONZEPT-ACCOUNTS.md; Einrichtung siehe README)
  mode: local

# Nur im gehosteten Betrieb.
accounts:
  max_profiles: 5
  # Masterschluessel und Pepper: zuerst systemd-Credentials, sonst hier
  # (Dateien master.key / pepper.key, Rechte 0600). Nie in storage/ oder git.
  key_dir: /etc/pomodoro
  base_url: https://pomodoro.example.org   # fuer Links in Mails
  timezone: Europe/Berlin                  # Vorgabe fuer neue Konten
  cookie_secure: true
  # breached_list: /var/lib/pomodoro/pwned-passwords-sha1-ordered-by-hash.txt

mail:
  host:            # leer = Mails nur auf der Konsole (Entwicklung)
  port: 587
  user:
  starttls: true
  sender: "Pomodoro <pomodoro@example.org>"
