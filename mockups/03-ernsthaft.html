<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Pomodoro-Mockup — Ernsthaft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #DCDCD8; display: flex; justify-content: center; padding: 24px; }
  a { color: #1F3A5F; }
  .frame { width: 1280px; height: 860px; background: #F4F4F2; color: #1A1A18; display: flex; overflow: hidden; border-radius: 4px; }
  button { font-family: 'IBM Plex Sans', sans-serif; cursor: pointer; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="frame">

  <!-- Main -->
  <div style="flex-grow: 1; display: flex; flex-direction: column;">

    <div style="padding: 18px 28px; background: #FFFFFF; border-bottom: 1px solid #DEDEDA; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <div style="font-size: 18px; font-weight: 600;">Zeiterfassung — Pomodoro</div>
        <div style="font-size: 12px; color: #7A7A74; margin-top: 1px;">Sitzung 3 von 4 · gestartet 14:06 Uhr</div>
      </div>
      <div style="display: flex; gap: 10px;">
        <button style="background: #FFFFFF; color: #1A1A18; border: 1px solid #C9C9C3; border-radius: 3px; padding: 8px 14px; font-size: 13px; font-weight: 500;">Bericht exportieren</button>
        <button style="background: #FFFFFF; color: #1A1A18; border: 1px solid #C9C9C3; border-radius: 3px; padding: 8px 14px; font-size: 13px; font-weight: 500;">Einstellungen</button>
      </div>
    </div>

    <div style="padding: 22px 28px; display: flex; flex-direction: column; gap: 18px;">

      <div style="display: flex; gap: 18px;">

        <!-- Timer -->
        <div style="width: 322px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #DEDEDA; border-radius: 4px; padding: 20px;">
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.09em; color: #7A7A74;">LAUFENDE SITZUNG</div>
          <div style="display: flex; align-items: center; gap: 16px; margin-top: 14px;">
            <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true">
              <circle cx="46" cy="46" r="40" fill="none" stroke="#E8E8E4" stroke-width="7"></circle>
              <circle cx="46" cy="46" r="40" fill="none" stroke="#1F3A5F" stroke-width="7" stroke-dasharray="251.3" stroke-dashoffset="73" transform="rotate(-90 46 46)"></circle>
            </svg>
            <div>
              <div class="mono" style="font-size: 42px; font-weight: 500; line-height: 1; letter-spacing: -0.02em;">24:13</div>
              <div style="font-size: 12px; color: #7A7A74; margin-top: 4px;">Fokus · 25:00 geplant</div>
            </div>
          </div>
          <div style="display: flex; gap: 8px; margin-top: 18px;">
            <button style="flex-grow: 1; background: #1F3A5F; color: #FFFFFF; border: none; border-radius: 3px; padding: 10px; font-size: 13px; font-weight: 600;">Pausieren</button>
            <button style="background: #FFFFFF; color: #1A1A18; border: 1px solid #C9C9C3; border-radius: 3px; padding: 10px 14px; font-size: 13px;">Störung</button>
            <button style="background: #FFFFFF; color: #8A3030; border: 1px solid #C9C9C3; border-radius: 3px; padding: 10px 14px; font-size: 13px;">Abbrechen</button>
          </div>
          <div style="border-top: 1px solid #EDEDE9; margin-top: 18px; padding-top: 14px;">
            <label for="proj" style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.09em; color: #7A7A74; margin-bottom: 6px;">PROJEKT</label>
            <select id="proj" style="width: 100%; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1A1A18; background: #FFFFFF; border: 1px solid #C9C9C3; border-radius: 3px; padding: 8px;">
              <option>Rocketz Flying in the Wind</option>
              <option>GameDevTools</option>
            </select>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
              <button style="flex-grow: 1; background: #FFFFFF; border: 1px solid #C9C9C3; border-radius: 3px; padding: 7px; font-size: 12px;">Bearbeiten</button>
              <button style="flex-grow: 1; background: #FFFFFF; border: 1px solid #C9C9C3; border-radius: 3px; padding: 7px; font-size: 12px;">Neu anlegen</button>
              <button style="flex-grow: 1; background: #FFFFFF; border: 1px solid #C9C9C3; border-radius: 3px; padding: 7px; font-size: 12px;">Löschen</button>
            </div>
          </div>
        </div>

        <div id="kpis" style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;"></div>
      </div>

      <div style="display: flex; gap: 18px;">
        <div style="width: 470px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #DEDEDA; border-radius: 4px; padding: 16px;">
          <div style="font-size: 13px; font-weight: 600; margin-bottom: 4px;">Fokusminuten nach Tageszeit</div>
          <div style="font-size: 12px; color: #7A7A74; margin-bottom: 14px;">Letzte 30 Tage · Ø je Stunde</div>
          <div id="hours" style="display: flex; align-items: flex-end; gap: 4px; height: 128px;"></div>
          <div class="mono" style="display: flex; justify-content: space-between; font-size: 10px; color: #9A9A94; margin-top: 6px;">
            <span>00</span><span>06</span><span>12</span><span>18</span><span>23</span>
          </div>
        </div>

        <div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #DEDEDA; border-radius: 4px; overflow: hidden;">
          <div style="padding: 14px 16px 10px; font-size: 13px; font-weight: 600;">Sitzungen heute</div>
          <div style="display: grid; grid-template-columns: 74px 1fr 92px 70px 96px; padding: 7px 16px; background: #F7F7F5; border-top: 1px solid #EDEDE9; border-bottom: 1px solid #EDEDE9; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #7A7A74;">
            <div>START</div><div>PROJEKT / ZIEL</div><div>DAUER</div><div>STÖRUNG</div><div>FOKUS</div>
          </div>
          <div id="rows"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
    'use strict';

    var i;

    var kpis = [
        { label: 'POMODOROS HEUTE', value: '4 / 8', trend: 'Ziel zu 50 % erreicht', color: '#7A7A74' },
        { label: 'FOKUSZEIT HEUTE', value: '1:45 h', trend: '+18 min ggü. Ø', color: '#2F6B58' },
        { label: 'ABSCHLUSSQUOTE', value: '87 %', trend: '30-Tage-Mittel: 81 %', color: '#2F6B58' },
        { label: 'Ø STÖRUNGEN', value: '1,2', trend: '+0,3 ggü. Vorwoche', color: '#8A3030' },
        { label: 'STREAK', value: '6 Tage', trend: 'Bestwert: 14 Tage', color: '#7A7A74' },
        { label: 'FOKUS 30 TAGE', value: '38,5 h', trend: 'Ø 1,3 h / Tag', color: '#7A7A74' }
    ];
    var kpiBox = document.getElementById('kpis');
    for (i = 0; i < kpis.length; i++) {
        var card = document.createElement('div');
        card.style.cssText = 'background: #FFFFFF; border: 1px solid #DEDEDA; border-radius: 4px; padding: 16px;';
        card.innerHTML =
            '<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #7A7A74;">' + kpis[i].label + '</div>' +
            '<div class="mono" style="font-size: 28px; font-weight: 500; margin-top: 8px;">' + kpis[i].value + '</div>' +
            '<div style="font-size: 12px; color: ' + kpis[i].color + '; margin-top: 2px;">' + kpis[i].trend + '</div>';
        kpiBox.appendChild(card);
    }

    var data = [2, 1, 0, 0, 0, 0, 3, 9, 22, 41, 58, 63, 38, 29, 52, 71, 66, 48, 31, 24, 18, 11, 7, 4];
    var hourBox = document.getElementById('hours');
    for (i = 0; i < data.length; i++) {
        var v = data[i];
        var bar = document.createElement('div');
        bar.style.cssText = 'flex-grow: 1; height: ' + (Math.round((v / 71) * 124) + 4) + 'px; border-radius: 1px; background: ' +
            (v > 45 ? '#1F3A5F' : (v > 20 ? '#5B7A9B' : '#C3CDD8')) + ';';
        hourBox.appendChild(bar);
    }

    var rows = [
        ['08:12', 'Rocketz · Issue #42 Water flow', '25:00', '0', '5 / 5', '#2F6B58'],
        ['08:45', 'Rocketz · Issue #42 Water flow', '25:00', '2', '3 / 5', '#7A7A74'],
        ['09:30', 'GameDevTools · Pomodoro-Modul', '25:00', '1', '4 / 5', '#2F6B58'],
        ['11:02', 'Rocketz · Lumina-Schwarm', '12:40', '3', 'abgebrochen', '#8A3030'],
        ['13:20', 'Admin · Steuer', '25:00', '0', '4 / 5', '#2F6B58'],
        ['14:06', 'Rocketz · Issue #42 Water flow', 'läuft', '0', '—', '#7A7A74']
    ];
    var rowBox = document.getElementById('rows');
    for (i = 0; i < rows.length; i++) {
        var r = rows[i];
        var el = document.createElement('div');
        el.style.cssText = 'display: grid; grid-template-columns: 74px 1fr 92px 70px 96px; padding: 9px 16px; border-bottom: 1px solid #F2F2EF; font-size: 12.5px; align-items: center;';
        el.innerHTML =
            '<div class="mono" style="color: #55554F;">' + r[0] + '</div>' +
            '<div>' + r[1] + '</div>' +
            '<div class="mono">' + r[2] + '</div>' +
            '<div class="mono" style="color: #55554F;">' + r[3] + '</div>' +
            '<div class="mono" style="color: ' + r[5] + ';">' + r[4] + '</div>';
        rowBox.appendChild(el);
    }
})();
</script>
</body>
</html>
