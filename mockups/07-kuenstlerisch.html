<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Pomodoro-Mockup — Künstlerisch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Spectral', Georgia, serif; background: #D6CDB9; display: flex; justify-content: center; padding: 24px; }
  a { color: #C1543A; }
  .frame { width: 1280px; height: 860px; background: #EDE6D8; color: #2A2620; display: flex; overflow: hidden; position: relative; }
  button { font-family: 'Spectral', serif; cursor: pointer; }
  .hand { font-family: 'Caveat', cursive; }
</style>
</head>
<body>
<div class="frame">

  <div style="position: absolute; inset: 0; background: repeating-linear-gradient(94deg, rgba(42,38,32,0.022), rgba(42,38,32,0.022) 1px, rgba(255,255,255,0) 1px, rgba(255,255,255,0) 3px);"></div>
  <div style="position: absolute; top: 60px; right: 60px; width: 420px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(193,84,58,0.13) 0%, rgba(237,230,216,0) 70%);"></div>
  <div style="position: absolute; bottom: 20px; left: 300px; width: 460px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(56,80,122,0.12) 0%, rgba(237,230,216,0) 72%);"></div>

  <!-- Main -->
  <div style="flex-grow: 1; padding: 30px 34px; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 2;">

    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <div style="font-size: 34px; font-weight: 400; letter-spacing: -0.01em;">Die Tagesarbeit</div>
        <div class="hand" style="font-size: 22px; color: #C1543A; margin-top: 2px;">Sitzung drei von vier</div>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 28px;">
        <div class="hand" style="font-size: 19px; color: #38507A; line-height: 1.25; transform: rotate(-2deg); text-align: right;">„Vier Stück heute —<br>der Nachmittag gehört dir."</div>
        <div style="transform: rotate(1.5deg); background: #E3D9C6; border: 2px solid #2A2620; padding: 7px 16px; font-size: 13px; letter-spacing: 0.1em; white-space: nowrap;">6 TAGE IN FOLGE</div>
      </div>
    </div>

    <div style="display: flex; gap: 22px;">

      <div style="width: 520px; flex-shrink: 0; position: relative; transform: rotate(-1.1deg);">
        <div style="position: absolute; top: -13px; left: 50%; margin-left: -46px; width: 92px; height: 26px; background: rgba(217,164,65,0.55); border: 1px solid rgba(42,38,32,0.25); transform: rotate(-2.5deg);"></div>
        <div style="background: #F7F2E6; border: 2px solid #2A2620; box-shadow: 9px 9px 0 rgba(42,38,32,0.16); padding: 26px 24px; display: flex; flex-direction: column; align-items: center;">
          <div style="font-size: 12px; letter-spacing: 0.26em; color: #7A7060;">FOKUS</div>

          <div style="position: relative; width: 252px; height: 252px; margin-top: 8px;">
            <svg width="252" height="252" viewBox="0 0 252 252" aria-hidden="true">
              <circle cx="126" cy="126" r="104" fill="none" stroke="#D6CBB4" stroke-width="3" stroke-dasharray="9 7"></circle>
              <circle cx="126" cy="126" r="104" fill="none" stroke="#C1543A" stroke-width="13" stroke-linecap="round" stroke-dasharray="653.5" stroke-dashoffset="190" transform="rotate(-90 126 126)" opacity="0.88"></circle>
              <circle cx="126" cy="126" r="110" fill="none" stroke="#2A2620" stroke-width="1.5" stroke-dasharray="230 19" opacity="0.5" transform="rotate(12 126 126)"></circle>
            </svg>
            <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
              <div style="font-size: 66px; font-weight: 300; letter-spacing: -0.02em; line-height: 1;">24:13</div>
              <div class="hand" style="font-size: 21px; color: #7A7060; margin-top: 4px;">von 25 Minuten</div>
            </div>
          </div>

          <div style="display: flex; gap: 10px; margin-top: 22px;">
            <button style="background: #C1543A; color: #F7F2E6; border: 2px solid #2A2620; padding: 12px 30px; font-size: 15px; font-weight: 600;">Pause</button>
            <button style="background: #F7F2E6; color: #2A2620; border: 2px solid #2A2620; padding: 12px 18px; font-size: 15px;">Störung</button>
            <button style="background: #F7F2E6; color: #7A7060; border: 2px solid #A99E8A; padding: 12px 18px; font-size: 15px;">Verwerfen</button>
          </div>
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px;">

        <div style="background: #F7F2E6; border: 2px solid #2A2620; padding: 18px; transform: rotate(0.7deg); box-shadow: 6px 6px 0 rgba(42,38,32,0.13);">
          <label for="proj" class="hand" style="display: block; font-size: 21px; color: #7A7060; margin-bottom: 6px;">Woran arbeitest du?</label>
          <select id="proj" style="width: 100%; font-family: 'Spectral', serif; font-size: 17px; color: #2A2620; background: #EDE6D8; border: 2px solid #2A2620; padding: 9px 10px;">
            <option>Rocketz Flying in the Wind</option>
            <option>GameDevTools</option>
          </select>
          <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button style="background: #EDE6D8; border: 2px solid #2A2620; padding: 6px 14px; font-size: 13px;">Bearbeiten</button>
            <button style="background: #6B7A4A; color: #F7F2E6; border: 2px solid #2A2620; padding: 6px 14px; font-size: 13px;">Neu</button>
            <button style="background: #EDE6D8; color: #94381F; border: 2px solid #2A2620; padding: 6px 14px; font-size: 13px;">Löschen</button>
            <div style="flex-grow: 1;"></div>
            <div class="hand" style="font-size: 19px; color: #38507A; align-self: center;">Issue #42 ✎</div>
          </div>
        </div>

        <div id="kpis" style="display: flex; gap: 14px;"></div>

        <div style="background: #F7F2E6; border: 2px solid #2A2620; padding: 18px; flex-grow: 1; transform: rotate(-0.5deg); box-shadow: 6px 6px 0 rgba(42,38,32,0.13);">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <div style="font-size: 17px; font-weight: 600;">Sechs Monate Arbeit</div>
            <div class="hand" style="font-size: 19px; color: #C1543A;">dein bestes Fenster: 15–17 Uhr</div>
          </div>
          <div id="heat" style="display: grid; grid-template-rows: repeat(7, 13px); grid-auto-flow: column; gap: 4px; margin-top: 14px;"></div>
          <div id="hours" style="display: flex; align-items: flex-end; gap: 3px; height: 58px; margin-top: 18px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
    'use strict';

    var i;

    var kpis = [
        ['1 h 45', 'FOKUS HEUTE', '#F7F2E6', '#2A2620', '#7A7060', '0.8deg'],
        ['4 / 8', 'TAGESZIEL', '#D9A441', '#2A2620', '#6B5A2E', '-1.2deg'],
        ['87 %', 'VOLLENDET', '#F7F2E6', '#2A2620', '#7A7060', '0.5deg']
    ];
    var kpiBox = document.getElementById('kpis');
    for (i = 0; i < kpis.length; i++) {
        var k = document.createElement('div');
        k.style.cssText = 'flex-grow: 1; background: ' + kpis[i][2] + '; border: 2px solid #2A2620; padding: 14px; transform: rotate(' + kpis[i][5] + ');';
        k.innerHTML =
            '<div style="font-size: 30px; font-weight: 400; color: ' + kpis[i][3] + '; line-height: 1;">' + kpis[i][0] + '</div>' +
            '<div style="font-size: 11px; letter-spacing: 0.14em; color: ' + kpis[i][4] + '; margin-top: 6px;">' + kpis[i][1] + '</div>';
        kpiBox.appendChild(k);
    }

    var pal = ['#E3D9C6', '#D6C9A8', '#D9A441', '#C1543A', '#94381F'];
    var heat = document.getElementById('heat');
    for (i = 0; i < 112; i++) {
        var c = document.createElement('div');
        c.style.cssText = 'width: 13px; height: 13px; background: ' + pal[(i * 5 + (i % 6) * 2 + (i % 13)) % 5] +
            '; border: 1px solid rgba(42,38,32,0.14);';
        heat.appendChild(c);
    }

    var data = [2, 1, 0, 0, 0, 0, 3, 9, 22, 41, 58, 63, 38, 29, 52, 71, 66, 48, 31, 24, 18, 11, 7, 4];
    var hourBox = document.getElementById('hours');
    for (i = 0; i < data.length; i++) {
        var v = data[i];
        var bar = document.createElement('div');
        bar.style.cssText = 'flex-grow: 1; height: ' + (Math.round((v / 71) * 54) + 4) + 'px; background: ' +
            (v > 45 ? '#38507A' : (v > 20 ? '#6B7A4A' : '#D6CBB4')) + ';';
        hourBox.appendChild(bar);
    }
})();
</script>
</body>
</html>
